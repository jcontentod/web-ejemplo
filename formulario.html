<!DOCTYPE html> 
<html lang="es" >   
<head>
        <meta charset="UTF-8"  
        <meta name="viewsport" content="width, initial scale" 
        <title> Formulario</title>
        <link rel="stylesheet" href="css/estilo.css"
</head>
<body>
    <header>
    <h1>Mi primera web de de Lenguaje de Marcas</h1>
    <h2>Menu:</h2>
    <nav>
        <a href="index1.html">Inicio</a>
        <a href="horario index.html">Horario</a>
        <a href="formulario.html">Formulario</a>

    </nav>
    </header>
    <main>
        <h1>Formulario de contacto</h1>
        <form>
            <fieldset>
                
                <legend>Informacion personal</legend>
                <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required />
                </p>

                <p>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password"  />
                </p>

                <p>
                    <label for="email">Correo electronico:</label>
                    <input type="email" id="email" name="email"
                </p>

                <p>
                    <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" name="telefono"
                </p>

                <p>
                    <label for="web">Página web:</label>
                    <input type="url" id="web" name="web" />
                </p>

                </fieldset>
                <fieldset>
                    <legend>Fechas y horas</legend>
                    <p>
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" name="fecha"
                    </p>

                    <p>
                        <label for="hora">Hora:</label>
                        <input type="time" id="hora" name="hora"
                    </p>

                    <p>
                        <label for="fechaHora">Fecha y hora:</label>
                        <input type="datetime-local" id="fechaHora" name="fechaHora"
                    </p>

                    <p>
                        <label for="mes">Mes:</label>
                        <input type="month" id="mes" name="mes"
                    </p>

                    <p>
                        <label for="semana">Semana:</label>
                        <input type="week" id="semana" name="semana"
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Valores numéricos</legend>
                    <p>
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" min="0" max="120">
                    </p>
                    <p>
                        <label for="valor">Nivel</label>
                        <input type="range" id="valor" name="valor" min="0" max="100">
                        
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Botones</legend>
                    <p>
                        <input type="submit" value="Enviar">
                        <input type="reset" value="Borrar">
                    </p>
                </fieldset>
                <fieldset>
                <legend>Opciones</legend>
                <p>Selecciona una opción:</p>
          <input type="radio" id="opcion1" name="opcion" value="1" />
          <label for="opcion1">Opción 1</label>

          <br/>

          <input type="radio" id="opcion2" name="opcion" value="2" />
          <label for="opcion2">Opción 2</label>

          <br/>

          <input type="radio" id="opcion3" name="opcion" value="3" />
          <label for="opcion3">Opción 3</label>
        
        
          <!-- CHECKBOX -->
          <p>Selecciona tus aficiones:</p>

          <input
            type="checkbox"
            id="deporte"
            name="aficiones"
            value="deporte"
          />

          <label for="deporte">Deporte</label>
          <br />

          <input type="checkbox" id="musica" name="aficiones" value="musica" />
          <label for="musica">Música</label>
          <br />

          <input
            type="checkbox"
            id="informatica"
            name="aficiones"
            value="informatica"
          />

          <label for="informatica">Informática</label>
        </fieldset>


            
        </form>
    </main>
    <!--FOOTER PIE PAGINA-->
    <footer>
        <p>CIFP Virgen de Gracia</p>
        <p>
            Contacto:
            <a href="jorgecontentod@gmail.com"
            >jorgecontentod@gmail.com</a>
        </p>
    </footer>
</body>
</html>
